name: require-label

on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string
      run-condition:
        default: true
        required: false
        type: boolean
    outputs:
      result:
        value: ${{ jobs.require-label.outputs.result }}
        description: Returns 'true' if the label is present, empty otherwise (cannot return 'false')

jobs:
  require-label:
    if: ${{ inputs.run-condition }}
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.check-for-label.outputs.result }}
    steps:
      - name: Check if label is present
        id: check-for-label
        # Ask the API, because the event payload keeps the labels from the time of the event, also on a re-run.
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ inputs.label }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::require-label needs a pull_request or pull_request_target event."
            exit 1
          fi
          present=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels?per_page=100" \
            --jq 'any(.[]; (.name | ascii_downcase) == (env.LABEL | ascii_downcase))')
          if [ "$present" = "true" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "::notice::✅ The label is present: '$LABEL'"
          fi
        shell: bash

      - name: Fail if label is not present
        if: steps.check-for-label.outputs.result != 'true'
        run: |
          echo "::error::❌ The label is missing: '${{ inputs.label }}'"
          echo "## 🚨 Missing Required Label" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Please add the following label to the pull request to proceed:" >> $GITHUB_STEP_SUMMARY
          echo "▶️ **${{ inputs.label }}**" >> $GITHUB_STEP_SUMMARY
          exit 1
        shell: bash
